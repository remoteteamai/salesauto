<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Melioro AI - Add to Campaign</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6366f1",
                        "primary-dark": "#4f46e5",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Background Dashboard Simulation (Blurred) -->
<div class="fixed inset-0 z-0 overflow-hidden filter blur-sm grayscale opacity-50 pointer-events-none">
<div class="max-w-6xl mx-auto p-8">
<div class="h-12 w-48 bg-slate-300 dark:bg-slate-700 rounded-lg mb-8"></div>
<div class="grid grid-cols-3 gap-6 mb-8">
<div class="h-32 bg-white dark:bg-slate-800 rounded-xl shadow-sm"></div>
<div class="h-32 bg-white dark:bg-slate-800 rounded-xl shadow-sm"></div>
<div class="h-32 bg-white dark:bg-slate-800 rounded-xl shadow-sm"></div>
</div>
<div class="h-96 bg-white dark:bg-slate-800 rounded-xl shadow-sm"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
<!-- Modal Container -->
<div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
<!-- Header -->
<div class="px-8 py-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-white">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
</div>
<div>
<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Add to Campaign</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Enroll selected prospects into an automated multi-channel sequence.</p>
</div>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto p-8 space-y-6">
<!-- Selected Summary -->
<div class="bg-primary/5 dark:bg-primary/10 border border-primary/20 rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-primary/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary leading-none">group</span>
</div>
<div>
<p class="text-xs font-semibold uppercase tracking-wider text-primary/80">Selected Leads</p>
<p class="text-lg font-bold text-slate-900 dark:text-white leading-none">128 prospects</p>
</div>
</div>
<button class="text-primary text-sm font-semibold hover:underline">Edit Selection</button>
</div>
<!-- Search & Filters -->
<div class="space-y-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
<input class="w-full pl-12 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-slate-900 dark:text-white transition-all" placeholder="Search existing multi-channel campaigns..." type="text"/>
</div>
<div class="flex gap-2 overflow-x-auto pb-2">
<button class="px-4 py-1.5 rounded-full bg-primary text-white text-xs font-semibold whitespace-nowrap">All Campaigns</button>
<button class="px-4 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors whitespace-nowrap">Email + LinkedIn</button>
<button class="px-4 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors whitespace-nowrap">Recent</button>
<button class="px-4 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors whitespace-nowrap">High Performance</button>
</div>
</div>
<!-- Campaign List -->
<div class="space-y-3">
<!-- Campaign Item 1 (Selected) -->
<label class="group relative flex items-center p-4 rounded-xl border-2 border-primary bg-primary/5 dark:bg-primary/5 cursor-pointer transition-all">
<input checked="" class="hidden" name="campaign" type="radio"/>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<h3 class="font-bold text-slate-900 dark:text-white">Q4 Enterprise Outreach</h3>
<span class="bg-primary/20 text-primary text-[10px] font-bold px-2 py-0.5 rounded uppercase">Active</span>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="material-symbols-outlined text-sm">alternate_email</span>
<span class="material-symbols-outlined text-sm">hub</span>
<span class="material-symbols-outlined text-sm">call</span>
</div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-slate-700 dark:text-slate-300">1,240</span> Active Leads
                                </div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-green-600 dark:text-green-400">14.2%</span> Success Rate
                                </div>
</div>
</div>
<div class="size-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="size-3 bg-primary rounded-full"></div>
</div>
</label>
<!-- Campaign Item 2 -->
<label class="group relative flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-all">
<input class="hidden" name="campaign" type="radio"/>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<h3 class="font-bold text-slate-900 dark:text-white">Inbound Lead Nurturing</h3>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="material-symbols-outlined text-sm">alternate_email</span>
<span class="material-symbols-outlined text-sm">hub</span>
</div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-slate-700 dark:text-slate-300">856</span> Active Leads
                                </div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-green-600 dark:text-green-400">9.8%</span> Success Rate
                                </div>
</div>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-700"></div>
</label>
<!-- Campaign Item 3 -->
<label class="group relative flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-all">
<input class="hidden" name="campaign" type="radio"/>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<h3 class="font-bold text-slate-900 dark:text-white">EMEA Tech Founders V2</h3>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="material-symbols-outlined text-sm">alternate_email</span>
<span class="material-symbols-outlined text-sm">call</span>
</div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-slate-700 dark:text-slate-300">421</span> Active Leads
                                </div>
<div class="flex items-center gap-1 text-slate-500 dark:text-slate-400 text-xs">
<span class="font-semibold text-green-600 dark:text-green-400">18.5%</span> Success Rate
                                </div>
</div>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-slate-700"></div>
</label>
</div>
<!-- Action Button: Create New -->
<button class="w-full flex items-center justify-center gap-2 p-4 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-xl text-slate-500 dark:text-slate-400 hover:text-primary hover:border-primary/50 hover:bg-primary/5 transition-all font-semibold">
<span class="material-symbols-outlined">add_circle</span>
                    Create New Campaign
                </button>
</div>
<!-- Footer -->
<div class="px-8 py-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3">
<button class="px-6 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Cancel
                </button>
<button class="px-8 py-2.5 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all flex items-center gap-2">
                    Add to Campaign
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
