# ============================================
# Melioro AI - Kubernetes Manifests
# ============================================

apiVersion: v1
kind: Namespace
metadata:
  name: melioro
  labels:
    name: melioro

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: melioro-config
  namespace: melioro
data:
  NODE_ENV: "production"
  PORT: "4000"
  # Add more config as needed

---
apiVersion: v1
kind: Secret
metadata:
  name: melioro-secrets
  namespace: melioro
type: Opaque
# Populate secrets via a sealed-secrets controller, external-secrets operator,
# or `kubectl create secret` — never commit plaintext values to version control.
# Example:
#   kubectl create secret generic melioro-secrets \
#     --namespace=melioro \
#     --from-literal=DATABASE_URL='<value>' \
#     --from-literal=JWT_SECRET='<value>' \
#     --from-literal=REDIS_URL='<value>'
data: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: melioro-backend
  namespace: melioro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: melioro-backend
  template:
    metadata:
      labels:
        app: melioro-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/melioro-ai/backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: melioro-config
            - secretRef:
                name: melioro-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: melioro-frontend
  namespace: melioro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: melioro-frontend
  template:
    metadata:
      labels:
        app: melioro-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/melioro-ai/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: melioro-backend
  namespace: melioro
spec:
  selector:
    app: melioro-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: melioro-frontend
  namespace: melioro
spec:
  selector:
    app: melioro-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: melioro-ingress
  namespace: melioro
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - melioro.ai
        - api.melioro.ai
      secretName: melioro-tls
  rules:
    - host: melioro.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: melioro-frontend
                port:
                  number: 3000
    - host: api.melioro.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: melioro-backend
                port:
                  number: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: melioro-backend-hpa
  namespace: melioro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: melioro-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: melioro-frontend-hpa
  namespace: melioro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: melioro-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70